name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # The ambient type shim is gone: the real @types/node and the DSH peer
      # packages must be installed for the typecheck to mean anything.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck source and tests
        run: pnpm run typecheck

      - name: Build
        run: pnpm run build

      - name: Test
        run: pnpm test
